<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>OG card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..800,0..100;1,9..144,300..800,0..100&family=Instrument+Sans:wght@400..700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<!-- the site's own stylesheet, so the plate, the type and the colours are the product rather than an ad for it -->
<link rel="stylesheet" href="../styles.css">
<style>
  *, *::before, *::after { animation: none !important; transition: none !important; }
  html, body { width: 1200px; height: 630px; overflow: hidden; margin: 0; padding: 0 !important; }
  body { display: grid; grid-template-rows: auto 1fr auto; position: relative; }
  body::after {
    content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(60% 80% at 82% 38%, color-mix(in srgb, var(--p-chicken) 22%, transparent), transparent 70%),
      radial-gradient(50% 60% at 0% 100%, color-mix(in srgb, var(--accent-2) 10%, transparent), transparent 70%);
  }

  .bar { display: flex; align-items: center; gap: 14px; padding: 40px 56px 0; }
  .bar .brand-mark { width: 52px; height: 52px; font-size: 21px; border-radius: 15px; }
  .wordmark b { display: block; font-family: var(--display); font-size: 24px; font-weight: 650; letter-spacing: -.015em; line-height: 1.1; }
  .wordmark small { display: block; font-family: var(--mono); font-size: 12px; text-transform: uppercase; letter-spacing: .2em; color: var(--ink-3); margin-top: 3px; }
  .span { margin-left: auto; font-family: var(--mono); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .14em; color: var(--accent); }

  .middle { display: grid; grid-template-columns: 1fr 430px; align-items: center; padding: 0 40px 0 56px; }
  h1 {
    font-size: 76px; line-height: .95; letter-spacing: -.045em; font-weight: 620;
    font-variation-settings: "SOFT" 60, "opsz" 144; max-width: 12ch;
  }
  h1 em {
    font-style: italic; font-weight: 520;
    background: linear-gradient(100deg, var(--accent) 20%, var(--accent-2));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .sub { margin-top: 20px; font-size: 20px; line-height: 1.45; color: var(--ink-2); max-width: 36ch; }

  .plate { position: relative; width: 430px; height: 400px; }
  .plate .stage-plate { width: 92%; top: 46%; }
  .plate .steam { display: none; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); margin: 0 56px 40px; border-top: 1px solid var(--line-2); }
  .stats div { padding: 16px 0 0; }
  .stats div + div { border-left: 1px solid var(--line-2); padding-left: 22px; }
  .stats b { display: block; font-family: var(--display); font-size: 36px; font-weight: 600; letter-spacing: -.03em; line-height: 1; font-variation-settings: "SOFT" 50, "opsz" 96; }
  .stats span { display: block; margin-top: 7px; font-family: var(--mono); font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .13em; color: var(--ink-3); }
</style>
</head>
<body>

  <div class="bar">
    <span class="brand-mark" id="mark"></span>
    <span class="wordmark"><b>Megan’s Grand</b><small>Mealplan</small></span>
    <span class="span" id="span"></span>
  </div>

  <div class="middle">
    <div>
      <h1>Five months of dinners, <em>already decided.</em></h1>
      <p class="sub">No dairy, no starch, no added sugar, no seed oils. Five proteins on rotation, every night portioned from the protein up.</p>
    </div>
    <div class="plate"><span class="stage-plate" id="plate"></span></div>
  </div>

  <div class="stats" id="stats"></div>

<script src="../data.js"></script>
<script src="../fx.js"></script>
<script src="../app.js"></script>
<script>
  /* every figure on the card is counted from the plan, never typed in */
  const nights = PLAN_MONTHS.reduce((a, m) => a + m.days.length, 0);
  const sourced = PLAN_MONTHS.reduce((a, m) => a + m.days.filter(d => d.source.url).length, 0);
  const floor = Math.min(...PLAN_MONTHS.flatMap(m => m.days.filter(d => d.protein_g).map(d => d.protein_g.him)));
  const first = PLAN_MONTHS[0], last = PLAN_MONTHS[PLAN_MONTHS.length - 1];
  document.getElementById("mark").textContent = nights;
  document.getElementById("span").textContent = `${first.short} to ${last.short} ${first.first.slice(0, 4)}`;
  document.getElementById("stats").innerHTML = [
    [nights, "dinners"], [PLAN_MONTHS.length, "months"], [sourced, "sourced recipes"], [`${Math.floor(floor / 10) * 10}g+`, "protein a plate"]
  ].map(([b, s]) => `<div><b>${b}</b><span>${s}</span></div>`).join("");
  // the first night of the plan, Greek sheet pan chicken: the most colourful plate in five months
  document.getElementById("plate").innerHTML = stagePlate(PLAN_MONTHS[0].days[0]);
</script>
</body>
</html>
